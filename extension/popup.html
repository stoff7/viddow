<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #fff; --text: #1a1a1a; --muted: #6b7079; --border: #e3e5ea; --track: #eef0f3;
    --accent: #2563eb; --ok: #15803d; --danger: #b91c1c; --warn: #b45309;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1d24; --text: #e8eaee; --muted: #9aa0ab; --border: #2c303a; --track: #262a33;
            --accent: #4f8bff; --ok: #4ade80; --danger: #f87171; --warn: #fbbf24; }
  }
  body { margin: 0; width: 400px; background: var(--bg); color: var(--text);
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  section + section { border-top: 1px solid var(--border); }
  header { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 6px; }
  h1 { font-size: 13px; margin: 0; flex: 1; }
  ul { list-style: none; margin: 0; padding: 0 14px 6px; max-height: 260px; overflow-y: auto; }
  li { padding: 8px 0; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .name { font-weight: 600; word-break: break-word; }
  .url { font: 11.5px var(--mono); word-break: break-all; }
  .badge { font: 600 10.5px var(--mono); color: var(--warn); margin-right: 4px; }
  .meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; word-break: break-word; }
  .meta.error { color: var(--danger); }
  .meta.done { color: var(--ok); }
  button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 4px 10px;
           border: 1px solid var(--border); background: transparent; color: var(--text); white-space: nowrap; }
  button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
  button.link { border: 0; padding: 0; color: var(--accent); font-weight: 400; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 6px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .done .bar span { background: var(--ok); }
  /* размер неизвестен — бегущая полоска */
  .bar.indeterminate span { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .bar.indeterminate span { animation: none; width: 100%; opacity: .35; } }
  .hint { color: var(--muted); padding: 2px 14px 12px; margin: 0; }
</style>
</head>
<body>
<section>
  <header><h1>Потоки на этой вкладке</h1>
    <button class="link" id="page" title="Для VK, YouTube, Rutube и др.: yt-dlp сам найдёт свежую ссылку на видео">Скачать страницу (yt-dlp)</button>
  </header>
  <ul id="streams"></ul>
  <p class="hint" id="streamsHint"></p>
</section>
<section id="jobsSection" hidden>
  <header><h1>Загрузки → ~/Downloads</h1><button class="link" id="clear">Очистить готовые</button></header>
  <ul id="jobs"></ul>
</section>
<script type="module" src="popup.js"></script>
</body>
</html>
