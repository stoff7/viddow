name: Windows personal test installer
on:
  push:
    branches: ['build/windows-installer-test']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extension model tests
        shell: bash
        run: node --test tests/test_*.mjs tests/test_page_preview.cjs
      - name: Build dependencies
        run: python -m pip install pyinstaller==6.16.0 pytest==8.4.2
      - name: Build full offline installer
        run: python packaging/windows/build.py
      - name: Windows tests
        run: python -m pytest -q tests/test_windows_job.py tests/test_windows_port.py tests/test_platform_support.py tests/test_native_session.py tests/test_windows_bundle.py
      - name: Test installed payload
        run: python packaging/windows/smoke.py
      - name: Final artifact checksums
        run: python packaging/windows/build.py --checksums-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Viddow-Windows-x64-test
          path: |
            dist/windows/*
          retention-days: 14
